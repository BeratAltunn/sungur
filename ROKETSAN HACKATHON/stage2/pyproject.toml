[project]
name = "sentinel"
version = "0.1.0"
description = "NÖBETÇİ: saha raporu destekli üs risk ajanı (ROKETSAN Level Up AI, Aşama 2)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
detector = ["ultralytics>=8.2", "transformers>=4.55,<4.56"]   # D-FINE yükleyicisi 4.55 ile test edildi (5.x ana sürüm, denenmedi)
dev = ["pytest>=8.0", "ruff>=0.5"]
e2e = ["playwright>=1.45"]   # tests/ui: sistem Chrome'u kullanır (channel="chrome")

[project.scripts]
sentinel = "sentinel.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

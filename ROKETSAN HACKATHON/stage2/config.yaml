# NÖBETÇİ yapılandırması. Yollar bu dosyanın klasörüne göre çözülür.
# Sabit kodlanmış eşik yok: tüm eşikler ve ağırlıklar burada.

data_dir: ../data                   # resmî Aşama 2 paketi (git'e girmez); dev verisi: ../stage2_dev_data
images_subdir: images

detector:
  kind: dfine                       # oracle (test) | dfine (Kaggle ekibinin modeli) | ultralytics (yedek yolov8n) | callable
  cache: true
  cache_dir: cache/detections
  tau_op: 0.4                       # operasyonel eşik (Kaggle eşiğinden ayrı)
  oracle_vehicle_m: [4.5, 2.0]      # oracle kutusunun yerdeki boyu (uzun, kısa kenar)
  # Kutunun yerdeki uzun kenarı [min, max] m dışındaysa araç sayılmaz. Dev verisinde KAPALI: görüntü ölçeği
  # köşe koordinatlarıyla uyuşmuyor (eşleşen gerçek araçlarda medyan 10 m, en fazla 75 m). Resmi veride yeniden ölç.
  plausible_size_m: null
  ultralytics:
    weights: models/yolov8n.pt      # geçici: COCO önceden eğitilmiş; Kaggle ekibinin .pt dosyası buraya
    imgsz: 960
    device: null                    # null → otomatik (mps/cuda/cpu)
    min_conf: 0.05                  # τ_op altı kutular "düşük güven" katmanına düşer, silinmez
    agnostic_nms: true              # aynı araca çizilen car+bus çift kutularını birleştir
    class_map: {car: car, van: van, truck: truck, bus: bus}
  dfine:                            # Kaggle ekibinin D-FINE-M modeli (EMA ağırlıkları, git'e girmez), transformers ile
    weights: models/dfine_m_kaggle.pth
    input_size: [800, 1408]         # (h, w) eğitim boyutu; çapa ızgarasından çıkarıldı, Ekip-1 teyit etti (cv2 düz gerdirme, letterbox yok)
    class_names: [car, truck, van, bus]   # indeks sırası; yarışma sayfasındaki sıradan FARKLI (Ekip-1 teyit etti)
    device: null                    # null → otomatik (mps/cuda/cpu)
    min_conf: 0.05                  # τ_op altı kutular "düşük güven" katmanına düşer, silinmez
  callable:
    target: null                    # "paket.modul:predict" → predict(path) -> [(label, conf, x, y, w, h)]

tracking:
  gate_m: 10.0
  box_gate_factor: 1.5              # büyük kutularda kapı = max(gate_m, 1,5 × yarı köşegen)
  gate_max_m: 25.0
  frame_margin_m: 5.0               # yalnızca karenin içindeki (+5 m) track'ler eşlenebilir
  window_min: 120
  closing_window_min: 10
  stop_speed_mps: 0.5
  stop_min_steps: 2
  approach_closing_mps: 1.0
  approach_align: 0.7
  leaving_closing_mps: -1.0
  moving_speed_mps: 1.0

reports:
  radius_m: 200
  window_min: 120
  allow_after_capture: false
  time_aware: true                  # false yalnızca regresyon testi / karşılaştırma için
  stationary_default_min: 60
  stationary_min_coverage_min: 30
  stationary_max_disp_m: 50

risk:
  weights:
    proximity_near: 30              # < near_km
    proximity_mid: 15               # near_km .. mid_km
    approaching: 25
    stop_and_go: 10
    heavy: 10
    convoy: 15
    eta_short: 10                   # ETA < eta_short_min
    eta_mid: 5                      # ETA < eta_mid_min
    identity_contradicted: 20
    identity_confirmed: -20
    leaving: -15
    untracked: 5
  near_km: 2.0
  mid_km: 3.5
  eta_short_min: 5
  eta_mid_min: 10
  load_bonus_per_vehicle: 3         # ek yaklaşan araç başına
  load_bonus_cap: 10
  levels: {ORTA: 25, YUKSEK: 50, KRITIK: 75}
  convoy_min_size: 3
  convoy_heading_tol_deg: 30
  floor_critical_eta_min: 10
  floor_high_untracked_km: 2.0
  floor_high_untracked_min_conf: 0.6   # kayıtsız araç tabanı yalnızca emin tespitlerde (model gelince ayarla)

llm:
  provider: openai_compat           # openai_compat (GLM, anahtar yoksa şablon brief) | mock (test)
  prompt_version: analyst_v3
  temperature: 0.2
  max_tokens: 3000
  reasoning_effort: low             # düşünen modeller (glm-5.3) bütçeyi düşünmeye harcamasın; null = gönderme
  timeout_s: 30
  max_retries: 3                    # geçici ağ geçidi hataları (503) artan beklemeyle yeniden denenir
  price_in_per_mtok: 0.6            # Varsayım V3
  price_out_per_mtok: 2.2
  budget_stop_usd: 12.0
  cache: true
  cache_dir: cache/llm
  max_level_deviation: 1

observability:
  runs_dir: runs
  labels_dir: calibration/labels    # kör altın set etiketleri (git'e girer, ekip paylaşır)

# Canlı demonun dayandığı şeyler (make demo-check korur). Senaryo: DEMO.md
impact:                             # vardiya simülasyonu (#/impact, triage'da oynatma); model, kanıt değil
  manual_min_assumed: 6.0           # elle kare başına dk (tasarım V5); kronometre ölçümü ≥ 3 ise o kullanılır
  system_min_assumed: 1.0           # sistemle kare başına dk; açılış→karar ölçümü ya da kronometre ≥ 3 ise o
  min_measurements: 3

demo:
  frames:
    img_000860: KRİTİK              # ana kare: 4 araçlık konvoy, kamyon T0122, ETA ~4,5 dk
    img_001733: DÜŞÜK               # karşıt kare: üsse 2,7 km, yaklaşan yok; 13:40 "kamyon" raporu tespitle çelişiyor
  contradicted:
    img_000860: [R119, R125]        # aha anı: 12:25 "bize bağlı otomobil", 12:35 "hareketleri olağan"
    img_001733: [R042]              # rapor "yüklü kamyon" diyor, T0206 görüntüde otomobil: rapor tehdidi abartıyor
  no_contradiction: []
  chat:                             # yalnızca `demo-check --chat` ile (LLM çağırır)
    - question: "Bu karedeki en riskli araç neden riskli?"
      image_id: img_000860
    - question: "Bu karedeki kamyon neden riskli?"   # demo sorusu: 4 araç 100 puanda eşit, anlatı kamyon üzerine
      image_id: img_000860
    - question: "T0122 12:35'te neredeydi?"
    # demo akışı: V7 kartta "Sor" ile bağlama eklenir, Alt+1 ilk hazır soruyu sorar (metin öneri üreticisinden gelir)
    - question: "R119 raporundaki kimlik iddiası V7 (T0122) için neden kanıtla çelişiyor?"
      image_id: img_000860
      vehicle_ref: V7
  chat_max_s: 45


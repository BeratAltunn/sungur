# Standalone MODEL-ONLY config for running model_ep12 (D-FINE-M / HGNetv2-B2).
# No __include__: the repo's base/dataloader.yml carries an IR CopyPaste stack
# pointed at <dataset paths> which is irrelevant (and absent) here.
#
# Architecture reverse-engineered from the checkpoint:
#   enc_score_head.bias        (4,)            -> num_classes = 4
#   denoising_class_embed      (5, 256)        -> num_classes + 1, hidden_dim 256
#   input_proj.{0,1,2}.conv    384/768/1536    -> HGNetv2 B2
#   decoder.decoder.layers.0-3                 -> num_layers = 4
#   decoder.anchors            (1, 23100, 4)   -> 21*H*W/1024 = 23100 -> H*W = 1126400
#                                              -> 800 x 1408 (the only 16:9-ish /32 pair)
task: detection

model: DEIM
postprocessor: PostProcessor

num_classes: 4
remap_mscoco_category: False
use_focal_loss: True

img_height: &img_height 800
img_width: &img_width 1408
eval_spatial_size: [*img_height, *img_width]   # [H, W]

DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  pretrained: False
  local_model_dir: pretrained_backbone/
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 0.67
  act: 'silu'

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1

PostProcessor:
  num_top_queries: 300

# --- stubs: YAMLConfig.__init__ rescales these by total_batch_size on construction ---
freeze_backbone_iters: 0
freeze_neck_iters: 0
eval_freq: 1
max_iters: 0
use_ema: True
ema: {type: ModelEMA, decay: 0.9999, warmups: 1}
lr_scheduler: {type: MultiStepLR, milestones: [1], gamma: 0.1}
train_dataloader: {total_batch_size: 1, num_workers: 0}
